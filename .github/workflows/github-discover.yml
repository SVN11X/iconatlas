name: Descubrir bibliotecas de iconos GitHub
on:
  schedule:
    - cron: '41 5 * * 6'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: github-discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Buscar repositorios todavía no registrados
        run: node scripts/github-discover.mjs --out github-discovery-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: github-discovery-report
          path: github-discovery-report.json
          retention-days: 30
      - name: Generar propuestas en un issue (sin incorporación automática)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('github-discovery-report.json', 'utf8'));
            const { owner, repo } = context.repo;
            const title = 'IconAtlas: repositorios de iconos candidatos';
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const old = issues.find(i => !i.pull_request && i.title === title);
            const body = [
              `Exploración ${report.checkedAt}. ${report.candidates.length} candidatos (no importados).`,
              '',
              ...report.candidates.map(c => `- [${c.repo}](${c.url}) · ${c.formats.svg} SVG · ${c.stars} ⭐ · licencia declarada: ${c.licenseDetected}${c.truncated ? ' · árbol truncado' : ''}`),
              '', 'Antes de aprobar: confirmar que los SVG son redistribuibles, autoría, formato, seguridad, calidad y coincidencias con el catálogo existente.',
              ...(report.errors.length ? ['', 'Errores:', ...report.errors.map(e => `- ${e}`)] : []),
            ].join('\n').slice(0, 60000);
            if (old) await github.rest.issues.update({ owner, repo, issue_number: old.number, body });
            else if (report.candidates.length || report.errors.length) await github.rest.issues.create({ owner, repo, title, body });
