name: Importar colección GitHub aprobada
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      source_id:
        description: ID de fuente aprobada en src/catalog/github-sources.json
        type: string
        required: false
        default: all

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Importar SVG autorizados desde el commit de GitHub
        run: |
          if [ "$SOURCE_ID" = 'all' ]; then
            npm run github:import -- --all
          else
            npm run github:import -- --id "$SOURCE_ID"
          fi
        env:
          SOURCE_ID: ${{ inputs.source_id || 'all' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generar catálogo y ejecutar pruebas
        run: |
          npm run catalog -- --strict
          npm run catalog:validate
          npm run typecheck
          npm test
          npm run build
      - name: Abrir PR para revisar los nuevos archivos
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/icons-${{ inputs.source_id || 'all' }}
          delete-branch: true
          title: "Importación de iconos de ${{ inputs.source_id || 'all' }}"
          commit-message: "chore(icons): importar fuentes GitHub aprobadas ${{ inputs.source_id || 'all' }}"
          body: |
            Importación programada o manual de las fuentes aprobadas en el registro.
            Revisar licencias, procedencia, cantidad y posibles duplicados antes de fusionar.
          add-paths: |
            vendor/
            src/catalog/collections/
