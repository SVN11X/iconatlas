name: Auditar repositorios de iconos
on:
  schedule:
    - cron: '29 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: github-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar repositorios y activos
        run: node scripts/github-health.mjs --out github-health-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: github-health-report
          path: github-health-report.json
          retention-days: 30
      - name: Abrir o actualizar issue si algo falla
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('github-health-report.json', 'utf8'));
            const bad = report.results.filter(r => !['healthy', 'paused'].includes(r.state));
            const title = 'IconAtlas: revisión de fuentes GitHub';
            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const issue = existing.find(i => !i.pull_request && i.title === title);
            if (!bad.length) {
              if (issue) await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Auditoría ${report.checkedAt}: fuentes sin incidencias. Revisar cierre del issue.` });
              return;
            }
            const body = [
              `Informe ${report.checkedAt}. Repositorios con incidencias: ${bad.length}.`, '',
              ...bad.map(r => `- **${r.repo}**: ${r.state} ${r.error || r.canonical || (r.truncated ? '(árbol incompleto)' : '')}`),
              '', 'Consulta el artefacto github-health-report para más detalles. No se importan recursos automáticamente.',
            ].join('\n').slice(0, 50000);
            if (issue) await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
            else await github.rest.issues.create({ owner, repo, title, body });
