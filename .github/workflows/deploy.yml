name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # El sitio se publica en https://<usuario>.github.io/<repositorio>/
  BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar y validar el catálogo
        run: |
          npm run catalog -- --strict
          npm run catalog:validate

      - name: Comprobación de tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm test

      - name: Construir índice universal de recursos GitHub (registro dinámico)
        run: npm run github:index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir informe de cobertura del índice GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-universal-index-report
          path: public/github-index/report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Compilar
        run: npm run build

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E (subruta de GitHub Pages)
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Subir informe E2E si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
